workflows:
  customer-android:
    name: Customer App - Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.pub-cache
    scripts:
      - name: Rebuild project
        script: |
          chmod +x setup.sh
          bash setup.sh

      - name: Generate android folder
        script: |
          cd apps/customer
          flutter create --platforms=android --org com.handmade --project-name customer_app .

      - name: Set up local.properties
        script: |
          cd apps/customer/android
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties

      - name: Flutter pub get
        script: |
          cd apps/customer
          flutter pub get

      - name: Build APK
        script: |
          cd apps/customer
          flutter build apk --release

    artifacts:
      - apps/customer/build/app/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - ahmedmagdey736@gmail.com
        notify:
          success: true
          failure: true
