workflows:
  customer-android:
    name: Customer App - Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: |
          cd apps/customer
          flutter pub get
      - name: Build APK
        script: |
          cd apps/customer
          flutter build apk --release
    artifacts:
      - apps/customer/build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  merchant-android:
    name: Merchant App - Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: |
          cd apps/merchant
          flutter pub get
      - name: Build APK
        script: |
          cd apps/merchant
          flutter build apk --release
    artifacts:
      - apps/merchant/build/app/outputs/**/*.apk
