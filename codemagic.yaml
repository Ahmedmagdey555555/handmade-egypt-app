
merchant-build:
  name: Merchant App - Android
  max_build_duration: 90
  instance_type: mac_mini_m2
  environment:
    flutter: stable
    java: 17
  cache:
    cache_paths:
      - ~/.gradle/caches
      - ~/.pub-cache
  scripts:
    - name: Rebuild Merchant 1A
      script: |
        chmod +x setup-merchant-1a.sh
        bash setup-merchant-1a.sh
    - name: Rebuild Merchant 1B
      script: |
        chmod +x setup-merchant-1b.sh
        bash setup-merchant-1b.sh
    - name: Rebuild Merchant 1C
      script: |
        chmod +x setup-merchant-1c.sh
        bash setup-merchant-1c.sh
    - name: Generate android folder
      script: |
        cd apps/merchant
        flutter create --platforms=android --org com.handmade --project-name merchant_app .
    - name: Write AndroidManifest
      script: |
        cd apps/merchant/android/app/src/main
        cat > AndroidManifest.xml << 'MANIFEST_END'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
            <application
                android:label="Handmade Merchant"
                android:name="${applicationName}"
                android:icon="@mipmap/ic_launcher">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:taskAffinity=""
                    android:theme="@style/LaunchTheme"
                    android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                    android:hardwareAccelerated="true"
                    android:windowSoftInputMode="adjustResize">
                    <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
                <meta-data android:name="flutterEmbedding" android:value="2"/>
            </application>
            <queries>
                <intent>
                    <action android:name="android.intent.action.PROCESS_TEXT"/>
                    <data android:mimeType="text/plain"/>
                </intent>
            </queries>
        </manifest>
        MANIFEST_END
    - name: Set up local.properties
      script: |
        cd apps/merchant/android
        echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
    - name: Flutter pub get
      script: |
        cd apps/merchant
        flutter pub get
    - name: Build APK
      script: |
        cd apps/merchant
        flutter build apk --release
    - name: Build AAB
      script: |
        cd apps/merchant
        flutter build appbundle --release
  artifacts:
    - apps/merchant/build/app/outputs/**/*.apk
    - apps/merchant/build/app/outputs/**/*.aab
  publishing:
    email:
      recipients:
        - ahmedmagdey736@gmail.com
      notify:
        success: true
        failure: true

        
