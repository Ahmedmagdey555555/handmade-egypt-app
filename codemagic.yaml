workflows:
  customer-android:
    name: Customer App - Android
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.pub-cache
    scripts:
      - name: Rebuild Phase 1A
        script: |
          chmod +x setup-phase1a.sh
          bash setup-phase1a.sh
      - name: Rebuild Phase 1B
        script: |
          chmod +x setup-phase1b.sh
          bash setup-phase1b.sh
      - name: Rebuild Phase 1C
        script: |
          chmod +x setup-phase1c.sh
          bash setup-phase1c.sh
      - name: Rebuild Phase 1D
        script: |
          chmod +x setup-phase1d.sh
          bash setup-phase1d.sh
      - name: Rebuild Phase 1E
        script: |
          chmod +x setup-phase1e.sh
          bash setup-phase1e.sh
      - name: Rebuild Phase 1F
        script: |
          chmod +x setup-phase1f.sh
          bash setup-phase1f.sh
      - name: Rebuild Phase 1G
        script: |
          chmod +x setup-phase1g.sh
          bash setup-phase1g.sh
      - name: Generate android folder
        script: |
          cd apps/customer
          flutter create --platforms=android --org com.handmade --project-name customer_app .
      - name: Force SDK 36 and Permissions
        script: |
          cd apps/customer/android
          
          # إجبار إصدار الـ SDK على 36
          if [ -f app/build.gradle ]; then
            sed -i '' 's/compileSdkVersion .*/compileSdkVersion 36/' app/build.gradle
            sed -i '' 's/targetSdkVersion .*/targetSdkVersion 36/' app/build.gradle
            sed -i '' 's/minSdkVersion .*/minSdkVersion 21/' app/build.gradle
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i '' 's/compileSdk = .*/compileSdk = 36/' app/build.gradle.kts
            sed -i '' 's/targetSdk = .*/targetSdk = 36/' app/build.gradle.kts
            sed -i '' 's/minSdk = .*/minSdk = 21/' app/build.gradle.kts
          fi

          # كتابة الـ AndroidManifest بالصلاحيات المطلوبة
          cd app/src/main
          cat > AndroidManifest.xml << 'MANIFEST_END'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <application
                  android:label="Handmade"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW"/>
                      <data android:scheme="https"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST_END
      - name: Convert SVG to PNG
        script: |
          cd apps/customer
          pip3 install cairosvg --quiet
          python3 -c "import cairosvg; cairosvg.svg2png(url='assets/icon.svg', write_to='assets/icon.png', output_width=1024, output_height=1024)"
      - name: Set up local.properties
        script: |
          cd apps/customer/android
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
      - name: Flutter Clean
        script: |
          cd apps/customer
          flutter clean
      - name: Flutter pub get
        script: |
          cd apps/customer
          flutter pub get
      - name: Generate launcher icons
        script: |
          cd apps/customer
          dart run flutter_launcher_icons
      - name: Build APK
        script: |
          cd apps/customer
          flutter build apk --release
    artifacts:
      - apps/customer/build/app/outputs/**/*.apk
